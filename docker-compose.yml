services:

  # ── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nas-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: nas
      POSTGRES_USER: nas
      POSTGRES_PASSWORD: nas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nas -d nas"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: nas-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine
    container_name: nas-valkey
    restart: unless-stopped

  queue-service:
    build:
      context: ./queue-service
      dockerfile: Dockerfile
    container_name: nas-queue-service
    environment:
      - QS_POSTGRES_DSN=postgresql+psycopg://nas:nas@postgres:5432/nas
      - QS_VALKEY_URL=redis://valkey:6379/0
      - QS_STREAM_KEY=bulk_ingest_events
      - QS_STREAM_GROUP=bulk_ingest_workers
      - QS_SERVICE_KEYS=internal-dev-key
      - QS_PORT=8005
      - QS_LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v23.3.21
    container_name: nas-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers=localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v2.4.6
    container_name: nas-redpanda-console
    ports:
      - "8085:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev"]
    volumes:
      - keycloak_data:/opt/keycloak/data
    container_name: nas-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── One-shot setup ────────────────────────────────────────────────────────
  db-migrate:
    build:
      context: .
      dockerfile: nas-processor/Dockerfile.migrate
    container_name: nas-db-migrate
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nas
      - PGUSER=nas
      - PGPASSWORD=nas
      - PGSCHEMA=nas
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  db-bootstrap:
    build:
      context: .
      dockerfile: nas-processor/Dockerfile.bootstrap
    container_name: nas-db-bootstrap
    env_file:
      - .env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nas
      - PGUSER=nas
      - PGPASSWORD=nas
    command: python bootstrap_lookups_if_needed.py
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  # ── Application ───────────────────────────────────────────────────────────

  worker:
    build:
      context: .
      dockerfile: nas-processor/Dockerfile.worker
    container_name: nas-worker
    env_file:
      - .env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nas
      - PGUSER=nas
      - PGPASSWORD=nas
      - PGSCHEMA=nas
      - INGEST_JOB_STATE_SCHEMA=ingest
      - ES_URL=http://opensearch:9200
      - OPENSEARCH_URL=http://opensearch:9200
      - OPENSEARCH_INDEX=nas_addresses
      - VALKEY_URL=redis://valkey:6379/0
      - VALKEY_STREAM_KEY=bulk_ingest_events
      - VALKEY_STREAM_GROUP=bulk_ingest_workers
      - INGEST_EXECUTION_MODE=queue_worker
      - WORKER_METRICS_PORT=9101
      - OBJECT_STORE_BUCKET=nas-uploads
      - OBJECT_STORE_ENDPOINT=http://minio:9000
      - OBJECT_STORE_SECURE=false
      - OBJECT_STORE_USE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - KAFKA_BROKERS=redpanda:9092
      - NAS_EVENTS_ENABLED=true
      - QUEUE_SERVICE_URL=http://queue-service:8005
      - QUEUE_SERVICE_KEY=internal-dev-key
    volumes:
      - nas_output:/app/output
      - nas_logs:/app/logs
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_started
      opensearch:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      queue-service:
        condition: service_healthy
    restart: unless-stopped

  nas-matcher:
    build:
      context: .
      dockerfile: nas-processor/Dockerfile.worker
    container_name: nas-matcher
    command: python -m nas_processor.src.matcher.worker
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nas
      - PGUSER=nas
      - PGPASSWORD=nas
      - PGSCHEMA=nas
      - MATCHER_AUTO_THRESHOLD=0.92
      - MATCHER_REVIEW_THRESHOLD=0.70
      - MATCHER_BATCH_SIZE=100
      - MATCHER_POLL_INTERVAL=5
      - KAFKA_BROKERS=redpanda:9092
      - NAS_EVENTS_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  ingestion-api:
    build:
      context: ./ingestion-api
    container_name: nas-ingestion-api
    env_file:
      - .env
    environment:
      - KEYCLOAK_URL=http://keycloak:8080/realms/org-realm
      - KEYCLOAK_AUDIENCE=ingestion-api
      - REDIS_URL=redis://valkey:6379/0
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nas
      - PGUSER=nas
      - PGPASSWORD=nas
      - INGEST_JOB_STATE_SCHEMA=ingest
      - VALKEY_URL=redis://valkey:6379/0
      - VALKEY_STREAM_KEY=bulk_ingest_events
      - VALKEY_STREAM_GROUP=bulk_ingest_workers
      - OBJECT_STORE_BUCKET=nas-uploads
      - OBJECT_STORE_ENDPOINT=http://minio:9000
      - OBJECT_STORE_SECURE=false
      - OBJECT_STORE_USE_PATH_STYLE=true
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - QUEUE_SERVICE_URL=http://queue-service:8005
      - QUEUE_SERVICE_KEY=internal-dev-key
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      valkey:
        condition: service_started
      keycloak:
        condition: service_healthy
      minio:
        condition: service_healthy
      queue-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: nas-frontend
    ports:
      - "${FRONTEND_PORT:-8888}:80"
    depends_on:
      ingestion-api:
        condition: service_healthy
    restart: unless-stopped

  postgres-kong:
    image: postgres:16-alpine
    container_name: nas-postgres-kong
    hostname: postgres-kong
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - postgres_kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong", "-d", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kong-migrations:
    image: kong:3.6-ubuntu
    container_name: nas-kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_LOG_LEVEL: warn
    depends_on:
      postgres-kong:
        condition: service_healthy
    restart: on-failure
    profiles:
      - setup

  kong:
    image: kong:3.6-ubuntu
    container_name: nas-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_PORT: "5432"
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8100 reuseport backlog=16384"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_ADMIN_API_URI: "http://localhost:8100"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: warn
      KONG_PLUGINS: bundled
    ports:
      - "80:8000"
      - "8100:8100"
      - "8002:8002"
    depends_on:
      postgres-kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nas-processor-api:
    build:
      context: ./nas-processor
      dockerfile: nas_processor/src/api/Dockerfile
    container_name: nas-processor-api
    env_file:
      - .env
    environment:
      - KEYCLOAK_URL=http://keycloak:8080/realms/org-realm
      - KEYCLOAK_AUDIENCE=nas-processor-api
      - REDIS_URL=redis://valkey:6379/0
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=nas
      - PGUSER=nas
      - PGPASSWORD=nas
      - ES_URL=http://opensearch:9200
      - ES_INDEX=nas_addresses
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      keycloak:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped

  autocomplete-service:
    build:
      context: ./autocomplete-service
    container_name: nas-autocomplete
    expose:
      - "8002"
    environment:
      - OPENSEARCH_URL=http://opensearch:9200
      - REDIS_URL=redis://valkey:6379/0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      opensearch:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped

  address-search-service:
    build:
      context: ./address-search-service
      dockerfile: Dockerfile
    container_name: nas-address-search
    environment:
      - SEARCH_OPENSEARCH_URL=http://opensearch:9200
      - SEARCH_OPENSEARCH_INDEX=nas_addresses
      - SEARCH_POSTGRES_DSN=postgresql://nas:nas@postgres:5432/nas
      - SEARCH_REDIS_URL=redis://valkey:6379/0
      - SEARCH_AUTH_ENABLED=false
      - SEARCH_LOG_LEVEL=info
      - SEARCH_PORT=8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    restart: unless-stopped

  event-streaming-service:
    build:
      context: ./event-streaming-service
      dockerfile: Dockerfile
    container_name: nas-event-streaming
    environment:
      - ESS_KAFKA_BROKERS=redpanda:9092
      - ESS_POSTGRES_DSN=postgresql+psycopg://nas:nas@postgres:5432/nas
      - ESS_POSTGRES_SCHEMA=nas
      - ESS_API_KEYS=dev-key-001
      - ESS_PORT=8004
      - ESS_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  opensearch_data:
  keycloak_data:
  minio_data:
  nas_output:
  nas_logs:
  redpanda_data:
  postgres_kong_data:
